cargo-features = ["profile-rustflags"]

[package]
name = "llm-rs"
version = "0.1.0"
authors = ["Yijun Yu", "Vitali Borsak"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rayon = "1.9.0"
blas-src = { version = "0.10.0", features = ["intel-mkl"] }
cblas= "0.5.0"
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }

[dev-dependencies]
criterion = "*"
rand = "0.8.5"

# Build optimized binaries with debug info for use by profiling tools.
[profile.release]
debug = 1
[profile.bench]
debug = 1
rustflags = ["-Awarnings"]

[lib]
name = "llm_rs"
path = "src/lib.rs"

# Benchmarks
[[bench]]
name = "data_loader"
harness = false

[[bench]]
name = "matmul_forward"
harness = false

[[bench]]
name = "encoder_forward"
harness = false

[[bench]]
name = "encoder_backward"
harness = false

[[bench]]
name = "layernorm_forward"
harness = false

[[bench]]
name = "layernorm_backward"
harness = false

[[bench]]
name = "matmul_backward"
harness = false

[[bench]]
name = "attention_forward"
harness = false

[[bench]]
name = "attention_backward"
harness = false

[[bench]]
name = "gelu_forward"
harness = false

[[bench]]
name = "gelu_backward"
harness = false

[[bench]]
name = "residual_forward"
harness = false

[[bench]]
name = "residual_backward"
harness = false

[[bench]]
name = "softmax_forward"
harness = false

[[bench]]
name = "crossentropy_forward"
harness = false

[[bench]]
name = "crossentropy_softmax_backward"
harness = false